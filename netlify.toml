[build]
  command = "npm run check"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "ejs", "serverless-http", "nodemailer"]
  included_files = ["views/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
